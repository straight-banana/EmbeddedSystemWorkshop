ard:`// I2C Output — Arduino + 0.91" OLED (SSD1306)

<span class="pp">#define</span> SCREEN_ADDR    <span class="num">0x3C</span>

<span class="kw">void</span> <span class="fn">setup</span>() {
  Serial.<span class="fn">begin</span>(<span class="num">9600</span>);

  <span class="kw">if</span> (!display.<span class="fn">begin</span>(SSD1306_SWITCHCAPVCC, SCREEN_ADDR)) {
    Serial.<span class="fn">println</span>(<span class="str">"SSD1306 not found!"</span>);

  display.<span class="fn">setTextSize</span>(<span class="num">1</span>);
  display.<span class="fn">setCursor</span>(<span class="num">0</span>, <span class="num">0</span>);

  <span class="fn">delay</span>(<span class="num">2000</span>);
}

<span class="kw">void</span> <span class="fn">loop</span>() {
  <span class="kw">static</span> <span class="kw">int</span> count = <span class="num">0</span>;

  display.<span class="fn">clearDisplay</span>();
  display.<span class="fn">setTextSize</span>(<span class="num">1</span>);
  display.<span class="fn">setCursor</span>(<span class="num">0</span>, <span class="num">0</span>);
  display.<span class="fn">println</span>(<span class="str">"Counter:"</span>);
  display.<span class="fn">setTextSize</span>(<span class="num">2</span>);
  display.<span class="fn">setCursor</span>(<span class="num">0</span>, <span class="num">14</span>);
  display.<span class="fn">println</span>(count++);
  display.<span class="fn">display</span>();
  <span class="fn">delay</span>(<span class="num">1000</span>);
}`,

let activeTopic='din', activeBoard='ard';

function render(){
  const t=codes[activeTopic];
  const libList=t.libs[activeBoard];
  const codeStr=activeBoard==='ard'?t.ard:t.esp;
  const boardLabel=activeBoard==='ard'?'Arduino':'ESP32';
  const fileName=activeTopic+'_'+activeBoard+'.ino';

  document.getElementById('panel').innerHTML=`
    ${t.note?`<div class="note">${t.note}</div>`:''}
    <div class="code-box">
      ${libList.length?`<div class="libs"><i class="ti ti-package" aria-hidden="true" style="font-size:14px;vertical-align:-2px;margin-right:4px"></i>Libraries: ${libList.map(l=>`<span class="lib-tag">${l}</span>`).join('')}</div>`:''}
      <div style="border-bottom:0.5px solid var(--color-border-tertiary)">
        <div class="board-tabs">
          <button class="board-btn ${activeBoard==='ard'?'active':''}" onclick="setBoard('ard')">Arduino</button>
          <button class="board-btn ${activeBoard==='esp'?'active':''}" onclick="setBoard('esp')">ESP32</button>
        </div>
      </div>
      <div class="code-header">
        <span class="code-label">${fileName}</span>
        <button class="copy-btn" onclick="copyCode(this,'${activeTopic}','${activeBoard}')">Copy</button>
      </div>
      <pre>${codeStr}</pre>
    </div>`;
}

function renderTopics(){
  document.getElementById('topicTabs').innerHTML=topics.map(t=>
    `<button class="topic-btn ${t.id===activeTopic?'active':''}" onclick="setTopic('${t.id}')">${t.label}</button>`
  ).join('');
}

window.setTopic=function(id){activeTopic=id;renderTopics();render();}
window.setBoard=function(b){activeBoard=b;render();}
window.copyCode=function(btn,topic,board){
  const raw=(board==='ard'?codes[topic].ard:codes[topic].esp).replace(/<[^>]+>/g,'');
  navigator.clipboard.writeText(raw).then(()=>{btn.textContent='Copied!';setTimeout(()=>btn.textContent='Copy',1500);});
}

renderTopics();
render();
</script>
